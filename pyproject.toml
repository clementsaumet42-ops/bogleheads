[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bogleheads-fr"
version = "0.8.0"
description = "Outil CGP Boglehead multi-enveloppes fiscales France 2026"
authors = [{name = "clementsaumet42-ops"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.2",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26",
    "pydantic>=2.0",
] 

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy",
    "types-PyYAML",
    "pre-commit",
]
optim = ["pulp"]

[tool.setuptools.packages.find]
where = ["." ]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90"]
ignore = ["E501", "C901", "B905", "SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]