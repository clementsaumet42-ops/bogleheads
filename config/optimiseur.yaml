# Profils d'aversion au risque (paramètre λ dans la fonction Markowitz)
# λ ∈ [0, 1] : 0 = minimise uniquement la variance, 1 = maximise uniquement le rendement
profils_aversion_risque:
  defensif:
    lambda: 0.2
    actions_max: 0.40
    actions_min: 0.00
    description: "Profil défensif — protection du capital, horizon court"

  equilibre:
    lambda: 0.5
    actions_min: 0.40
    actions_max: 0.70
    description: "Profil équilibré — compromis rendement/risque"

  dynamique:
    lambda: 0.8
    actions_min: 0.70
    actions_max: 0.90
    description: "Profil dynamique — croissance long terme"

  agressif:
    lambda: 1.0
    actions_min: 0.85
    actions_max: 1.00
    description: "Profil agressif — maximisation du rendement attendu"

# Frais de gestion par enveloppe (annuels, en fraction du montant géré)
frais_gestion_enveloppes:
  PEA: 0.000          # Courtiers en ligne : frais quasi-nuls
  PER: 0.007          # PER assurance : ~0,50-0,90% de frais UC + gestionnaire
  AV: 0.008           # Assurance-vie UC : ~0,60-1,00% selon contrat
  CTO: 0.001          # CTO : droits de garde ~0,10%
  PEE: 0.004          # PEE : frais tiers gestionnaire ~0,40%
  Contrat_Cap_IS: 0.008  # Contrat cap IS : identique AV
  CTO_IS: 0.001

# Taux sans risque de référence (pour calcul du Sharpe)
taux_sans_risque: 0.025   # OAT 10 ans France 2026

# Mode de granularité des actions (simple = ACWI 1 ligne, granulaire = US + Dev ex-US + EM)
mode_granularite_actions_defaut: "simple"
