  actions_em:
    valeur: 0.085
    intervalle_confiance_95: [0.040, 0.130]
    source_specifique: "Consensus JPM LTCMA 2026 (8-9%) + RA 2026-Q1 prime EM (~1.5pp) — valeur centrale 8.5%"
  obligations_agg_monde:
    valeur: 0.030
    intervalle_confiance_95: [0.015, 0.050]
    source_specifique: "JPM LTCMA 2026 Global Aggregate (2.9%) — valeur centrale 3.0%"
  obligations_euro:
    valeur: 0.025
    intervalle_confiance_95: [0.010, 0.045]
    source_specifique: "JPM LTCMA 2026 Euro Aggregate (2.5%) — rendement en ligne avec OAT 10 ans France 2026"
  reit:
    valeur: 0.060
    intervalle_confiance_95: [0.025, 0.095]
    source_specifique: "à reviewer — valeur héritée, calibration à refaire sur MSCI World Real Estate Index"  # TODO: recalibrer avec données réelles MSCI
  or_matieres:
    valeur: 0.040
    intervalle_confiance_95: [0.000, 0.085]
    source_specifique: "à reviewer — valeur héritée, calibration à refaire sur LBMA Gold 1995-2024"  # TODO: recalibrer avec données réelles LBMA
  monetaire:
    valeur: 0.028
    intervalle_confiance_95: [0.010, 0.045]
    source_specifique: "OAT court terme France 2026 / taux BCE : valeur ancrée sur taux directeur BCE actuel"
  actions_monde_acwi:
    valeur: 0.072
    intervalle_confiance_95: [0.035, 0.110]
    source_specifique: "Moyenne pondérée ACWI (~60% US + ~28% dev ex-US + ~12% EM) des sources ci-dessus — valeur centrale 7.2%"

