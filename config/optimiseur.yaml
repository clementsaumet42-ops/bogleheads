# Configuration de l'optimiseur d'allocation — Sprint S2 / S11-A
# Rendements, risques et corrélations par classe d'actifs (long terme)
# Source : données historiques long terme, calibrées pour un investisseur Boglehead FR 2026

# Bloc métadonnées — sources et hypothèses de calcul (S11-A : documentées et traçables)
hypotheses_meta:
  base: "Rendements nominaux annualisés en EUR, horizon d'investissement 15 ans"
  inflation_attendue: 0.020   # 2 % zone Euro long terme BCE
  sources:
    - "Research Affiliates Capital Market Assumptions 2026-Q1"
    - "JPM Long-Term Capital Market Assumptions 2026"
    - "Vanguard Capital Markets Model 2026"
    - "BlackRock Investment Institute 2026 Outlook"
  date_maj: "2026-04-24"
  devise_reference: "EUR"
  juridiction: "France"
  avertissement: >
    Les rendements attendus sont des espérances mathématiques long terme.
    Les performances passées ne préjugent pas des performances futures.
    Aucune garantie de rendement n'est fournie.

# ─── S11-A : Métadonnées de calibration ───────────────────────────────────────
metadonnees:
  date_calibration: "2026-04-24"
  periode_donnees:
    debut: "1995-01-31"
    fin:   "2024-12-31"
    nb_observations_mensuelles: 360
  methodologie:
    rendements_esperes:
      methode: "Consensus de sources institutionnelles 2026 (JPM, Vanguard, Research Affiliates, BlackRock)"
      source: "JPM LTCMA 2026, Vanguard Capital Markets Model 2026, Research Affiliates 2026-Q1"
      url: "https://am.jpmorgan.com/us/en/asset-management/adv/insights/portfolio-insights/ltcma/"
    volatilites:
      methode: "Écart-type annualisé — estimations institutionnelles consensuelles sur données 1995-2024"
      source: "MSCI Net Total Return EUR séries — calcul σ × √12 sur rendements mensuels"
    correlations:
      methode: "Corrélation de Pearson long terme — matrice consensuelle Boglehead FR 2026"
      source: "Estimations consolidées JPM LTCMA, Vanguard, MSCI 1995-2024"
      shrinkage_applique: false  # Ledoit-Wolf optionnel (activé par appliquer_shrinkage=True)
  avertissements:
    - "Les rendements espérés sont des hypothèses long terme, NON des prévisions."
    - "Les performances passées ne préjugent pas des performances futures (AMF 2019-03)."
    - "La calibration suppose stationnarité des distributions de rendements (hypothèse forte)."
    - "Ces hypothèses doivent être révisées annuellement ou lors de changements de régime majeurs."

# ─── Rendements espérés documentés (S11-A) ────────────────────────────────────
rendements_esperes:
  actions_usa:
    valeur: 0.078
    intervalle_confiance_95: [0.040, 0.116]
    source_specifique: "Consensus JPM LTCMA 2026 (7.4%) + Vanguard VCM 2026 (7-9%) — valeur centrale 7.8%"
  actions_dev_ex_usa:
    valeur: 0.065
    intervalle_confiance_95: [0.030, 0.100]
