# Configuration fiscale exhaustive France 2026
# Sources : Code Général des Impôts (CGI), LFSS 2026, LF 2026, Code monétaire et financier (CMF)
# À valider avec votre expert-comptable

annee: 2026

# ============================================================================
# PRÉLÈVEMENTS SOCIAUX (PS)
# ============================================================================
prelevements_sociaux:
  taux_global: 0.186  # 18.6%
  source: "Art. L.136-8 CSS"
  detail:
    csg: 0.121  # CSG 12.1%
    crds: 0.005  # CRDS 0.5%
    prelevement_solidarite: 0.060  # Prélèvement de solidarité 6.0%
  note: |
    Taux 2026 : 18.6% (CSG 12.1% + CRDS 0.5% + Prélèvement solidarité 6.0%).
    Historique : 17.2% en 2024, hausse progressive.

# ============================================================================
# PFU (PRÉLÈVEMENT FORFAITAIRE UNIQUE) - FLAT TAX
# ============================================================================
pfu:
  taux_ir: 0.128  # 12.8%
  taux_total_avec_ps: 0.314  # 31.4% (12.8% + 18.6%)
  source: "Art. 200 A CGI"
  option_bareme:
    description: "Option globale irrévocable pour l'année fiscale"
    source: "Art. 200 A-2 CGI"
    abattement_dividendes: 0.40  # 40%

# ============================================================================
# BARÈME IR 2026
# ============================================================================
bareme_ir_2026:
  source: "Art. 197 CGI"
  tranches:
    - jusqu_a: 11294
      taux: 0.00
    - jusqu_a: 28797
      taux: 0.11
    - jusqu_a: 82341
      taux: 0.30
    - jusqu_a: 177106
      taux: 0.41
    - au_dela: true
      taux: 0.45

quotient_familial:
  source: "Art. 194 CGI"
  parts:
    celibataire: 1.0
    couple: 2.0
    enfant_1: 0.5
    enfant_2: 0.5
    enfant_3_et_plus: 1.0
  plafonnement:
    source: "Art. 197 CGI"
    demi_part: 1759  # €
    part_entiere: 3518  # €

decote:
  source: "Art. 197 CGI"
  seuil_celibataire: 1929  # €
  seuil_couple: 3191  # €
  formule: "max(0, seuil - 0.75 × IR brut)"

# ============================================================================
# CEHR (CONTRIBUTION EXCEPTIONNELLE SUR LES HAUTS REVENUS)
# ============================================================================
cehr:
  source: "Art. 223 sexies CGI"
  tranches_celibataire:
    - rfr_min: 250001
      rfr_max: 500000
      taux: 0.03  # 3%
    - rfr_min: 500001
      taux: 0.04  # 4%
  tranches_couple:
    - rfr_min: 500001
      rfr_max: 1000000
      taux: 0.03  # 3%
    - rfr_min: 1000001
      taux: 0.04  # 4%

# ============================================================================
# CDHR (CONTRIBUTION DIFFÉRENTIELLE SUR LES HAUTS REVENUS)
# ============================================================================
cdhr:
  source: "Art. 223 terdecies CGI (LF 2025)"
  description: "Assure un taux minimum d'imposition de 20% sur le RFR"
  taux_plancher_effectif: 0.20  # 20%
  seuil_declenchement_celibataire: 250000  # €
  seuil_declenchement_couple: 500000  # €

# ============================================================================
# IS (IMPÔT SUR LES SOCIÉTÉS)
# ============================================================================
is:
  source: "Art. 219 CGI"
  taux_reduit: 0.15  # 15% jusqu'au seuil
  taux_normal: 0.25  # 25% au-delà
  seuil_taux_reduit: 42500  # € de bénéfice
  conditions_taux_reduit:
    - "CA < 10M€"
    - "Capital entièrement libéré et détenu à ≥ 75% par des personnes physiques"

# ============================================================================
# ASSURANCE VIE (AV)
# ============================================================================
assurance_vie:
  source: "Art. 125-0 A CGI, Art. 990 I CGI"
  seuils_encours:
    celibataire: 150000  # €
    couple: 300000  # €
  abattements_annuels:
    celibataire: 4600  # €
    couple: 9200  # €
  date_pivot: "2017-09-27"
  durees:
    moins_4_ans:
      taux_ir: 0.128  # PFU 12.8%
      abattement: false
    entre_4_8_ans:
      taux_ir: 0.128  # PFU 12.8%
      abattement: true
    plus_8_ans:
      avant_27_09_2017:
        taux_ir: 0.075  # PFL 7.5%
        option_bareme: true
      apres_27_09_2017:
        sous_seuil:
          taux_ir: 0.075  # PFL 7.5%
        au_dela_seuil:
          taux_ir: 0.128  # PFU 12.8%
  fonds_euro:
    ps_deja_preleves: true
    note: "PS prélevés annuellement par l'assureur"
  av_luxembourg:
    fiscalite: "identique_france"
    source: "Directive européenne"

# ============================================================================
# PEA (PLAN D'ÉPARGNE EN ACTIONS)
# ============================================================================
pea:
  source: "Art. 150-0 A CGI, Art. 157 CGI"
  plafonds:
    pea: 150000  # €
    pea_pme: 225000  # €
    cumul_max: 225000  # €
  fiscalite:
    moins_2_ans:
      ir: "TMI"
      ps: 0.186
      note: "IR au TMI + PS — Clôture du plan"
    entre_2_5_ans:
      ir: 0.128  # 12.8%
      ps: 0.186
      note: "IR 12.8% + PS — Clôture du plan"
    plus_5_ans:
      ir: 0.00  # Exonération
      ps: 0.186
      note: "Exonération IR, PS uniquement — Retraits libres"
  cas_force_majeure:
    source: "Art. 150-0 A-II-1° CGI"
    exoneration_totale: true
    cas:
      - "invalidité (titulaire, conjoint, enfant)"
      - "décès du conjoint"
      - "surendettement"
      - "expiration droits chômage"

# ============================================================================
# PER (PLAN D'ÉPARGNE RETRAITE)
# ============================================================================
per:
  source: "Art. 163 quatervicies CGI, Art. L.224-1 CMF"
  deduction_entree:
    plafond_forfait: 0.10  # 10% des revenus professionnels
    plafond_min: 4399  # €
    plafond_max: 35194  # € (8 PASS)
  sortie:
    capital:
      versements_deduits:
        ir: "TMI sur capital total"
        ps: "sur gains uniquement"
      versements_non_deduits:
        ir: "TMI sur gains uniquement"
        ps: "sur gains uniquement"
    rente:
      versements_deduits:
        imposition: "100% imposable au TMI"
      versements_non_deduits:
        imposition: "RVTO (rente viagère à titre onéreux)"
        source: "Art. 158-6 CGI"
        taux_imposable_age:
          moins_50_ans: 0.70
          50_59_ans: 0.50
          60_69_ans: 0.30
          70_ans_et_plus: 0.30
  cas_deblocage_anticipe:
    source: "Art. L.224-4 CMF"
    liste:
      - "décès du conjoint"
      - "invalidité titulaire (2e ou 3e catégorie)"
      - "invalidité conjoint"
      - "invalidité enfant"
      - "surendettement"
      - "expiration droits chômage"
      - "acquisition résidence principale (PERP ancien uniquement)"

# ============================================================================
# CONTRAT DE CAPITALISATION IS
# ============================================================================
contrat_capitalisation_is:
  source: "Art. 238 septies E CGI"
  base_taxable_formule: "105% × TME × prime versée"
  coefficient: 1.05
  tme_reference_2026: 0.030  # 3.0% (à vérifier mensuellement)
  regularisation_cession:
    description: "À la cession : IS sur PV réelle - IS forfaitaire déjà payé"
  avantage:
    condition: "Rendement réel > TME"
    note: "Base taxable très faible si TME bas (ex: 3% TME → 3.15% du capital)"

# ============================================================================
# MARK-TO-MARKET (MTM) OPCVM À L'IS
# ============================================================================
mark_to_market_is:
  source: "Art. 209-0 A CGI"
  seuil_detention: 0.90  # 90%
  description: |
    Les OPCVM (dont ETF) dont > 90% de l'actif est détenu par des sociétés IS
    sont soumis à réévaluation annuelle obligatoire (mark-to-market).
    Les plus-values latentes sont imposées à l'IS chaque année, même sans cession.
  consequence: "PV latentes imposées ANNUELLEMENT"
  alternative: "Contrat de capitalisation IS (taxation forfaitaire)"

# ============================================================================
# DIVERS
# ============================================================================
duree_report_deficit_cto: 10  # ans

tme_historique:
  note: "Taux Moyen des Emprunts d'État (TME) publié mensuellement"
  2026_estimation: 0.030  # 3.0%
  source: "Ministère de l'Économie"

notes_importantes:
  - "Ces taux sont indicatifs et doivent être validés avec un expert-comptable"
  - "Le taux PS 2026 (18.6%) est incertain : vérifier les textes définitifs"
  - "Option barème IR : irrévocable pour l'année, s'applique à TOUS les revenus du capital"
  - "AV : prorata versements avant/après 27/09/2017 complexe en pratique"
  - "PER : déduction plafonnée, report possible sur années N+3"
  - "MTM IS : piège majeur pour détention OPCVM en société IS"
