# Enveloppes fiscales disponibles — règles 2026

enveloppes:
  - id: CTO_perso
    nom: "Compte-Titres Ordinaire Personnel"
    plafond: null
    fiscalite_entree: "Aucune — versements en capital après IS/IR"
    fiscalite_courante:
      dividendes: "PFU 31,4% (12,8% IR + 18,6% PS) ou option barème + 18,6% PS — abattement 40% si barème"
      plus_values: "PFU 31,4% à la cession (ou barème)"
      moins_values: "Reportable 10 ans sur PV de même nature"
    fiscalite_sortie: "Identique fiscalité courante"
    avantages:
      - "Pas de plafond de versement"
      - "Liquidité totale"
      - "Large univers d'investissement"
    inconvenients:
      - "Imposition PV à la cession"
      - "Prélèvements sociaux sur dividendes chaque année"
