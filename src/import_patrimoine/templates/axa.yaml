emetteur:
  nom: "AXA"
  type: "assureur"
  signatures:
    - "AXA"
    - "AXA France Vie"
    - "AXA Wealth Europe"
    - "axa.fr"
    - "ORIAS 07 001 004"
  enveloppe_par_defaut_si_indetectable: "AV"

extraction:
  methode: "hybride"
  page_strategie: "toutes"

  detection_enveloppe:
    av: ["Assurance vie", "Coralis", "Odyssiel", "Contrat multisupport"]
    per: ["PER", "Plan d'Épargne Retraite", "AXA Retraite"]
    perin: ["PERin", "PER individuel"]

  colonnes_attendues:
    - nom: "isin"
      patterns: ["Code ISIN", "ISIN", "Code valeur"]
    - nom: "libelle"
      patterns: ["Support", "Fonds", "Libellé", "Unité de compte"]
    - nom: "quantite"
      patterns: ["Nombre de parts", "Unités de compte", "Nombre"]
    - nom: "valorisation"
      patterns: ["Valeur de rachat", "Valorisation", "Montant investi", "Valeur totale"]
    - nom: "cours"
      patterns: ["Valeur liquidative", "VL", "Cours", "Prix de part"]

  filtres_lignes:
    exclure_si_contient: ["Total", "TOTAL", "Fonds en euros", "Sous-total"]
    inclure_si_isin: false

regex_isin: '\b([A-Z]{2}[A-Z0-9]{9}[0-9])\b'
regex_montant_eur: '(\d{1,3}(?:[\s.,]\d{3})*(?:[,.]\d{2})?)\s*€?'

post_traitement:
  normalise_devises: true
  conversion_si_non_eur: false
