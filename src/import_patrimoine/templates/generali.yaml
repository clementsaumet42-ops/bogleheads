emetteur:
  nom: "Generali"
  type: "assureur"
  signatures:
    - "GENERALI"
    - "Generali Vie"
    - "Generali France"
    - "generali.fr"
    - "ORIAS 07 008"
  enveloppe_par_defaut_si_indetectable: "AV"

extraction:
  methode: "hybride"
  page_strategie: "toutes"

  detection_enveloppe:
    av: ["Assurance vie", "Multisupport", "Evolution Patrimoine", "Contrat d'assurance vie"]
    per: ["PER", "Plan d'Épargne Retraite", "Retraite"]
    perin: ["PERin", "PER individuel"]

  colonnes_attendues:
    - nom: "isin"
      patterns: ["Code ISIN", "ISIN"]
    - nom: "libelle"
      patterns: ["Libellé", "Support", "Fonds", "UC"]
    - nom: "quantite"
      patterns: ["Nombre de parts", "Parts", "Unités de compte"]
    - nom: "valorisation"
      patterns: ["Valeur de rachat", "Valorisation", "Montant total"]
    - nom: "cours"
      patterns: ["Valeur liquidative", "VL", "Valeur de part"]

  filtres_lignes:
    exclure_si_contient: ["Total", "TOTAL", "Fonds en euros"]
    inclure_si_isin: false

regex_isin: '\b([A-Z]{2}[A-Z0-9]{9}[0-9])\b'
regex_montant_eur: '(\d{1,3}(?:[\s.,]\d{3})*(?:[,.]\d{2})?)\s*€?'

post_traitement:
  normalise_devises: true
  conversion_si_non_eur: false
