emetteur:
  nom: "Société Générale"
  type: "banque"
  signatures:
    - "SOCIETE GENERALE"
    - "Société Générale"
    - "SG FRANCE"
    - "societegenerale.fr"
  enveloppe_par_defaut_si_indetectable: "CTO"

extraction:
  methode: "tableau"
  page_strategie: "toutes"

  detection_enveloppe:
    pea: ["PEA", "Plan d'Épargne en Actions"]
    pea_pme: ["PEA-PME"]
    cto: ["Compte titres", "CTO", "Titres ordinaires"]
    av: ["Assurance vie", "Sogecap", "Contrat d'assurance vie"]
    per: ["PER", "Plan d'Épargne Retraite"]
    livret: ["Livret A", "LDD", "Livret Épargne Populaire"]

  colonnes_attendues:
    - nom: "isin"
      patterns: ["Code ISIN", "ISIN", "Référence"]
    - nom: "libelle"
      patterns: ["Valeur", "Libellé", "Titre"]
    - nom: "quantite"
      patterns: ["Quantité", "Nombre", "Qté"]
    - nom: "valorisation"
      patterns: ["Valeur de marché", "Valorisation", "Montant"]
    - nom: "cours"
      patterns: ["Cours", "Prix"]

  filtres_lignes:
    exclure_si_contient: ["Total", "TOTAL", "Solde espèces"]
    inclure_si_isin: false

regex_isin: '\b([A-Z]{2}[A-Z0-9]{9}[0-9])\b'
regex_montant_eur: '(\d{1,3}(?:[\s.,]\d{3})*(?:[,.]\d{2})?)\s*€?'

post_traitement:
  normalise_devises: true
  conversion_si_non_eur: false
