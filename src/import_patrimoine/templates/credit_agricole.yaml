emetteur:
  nom: "Crédit Agricole"
  type: "banque"
  signatures:
    - "CREDIT AGRICOLE"
    - "Crédit Agricole"
    - "CA SA"
    - "credit-agricole.fr"
    - "LCL"
  enveloppe_par_defaut_si_indetectable: "CTO"

extraction:
  methode: "tableau"
  page_strategie: "toutes"

  detection_enveloppe:
    pea: ["PEA", "Plan d'Épargne en Actions"]
    pea_pme: ["PEA-PME"]
    cto: ["Compte titres", "CTO"]
    av: ["Assurance vie", "Predica", "Contrat d'assurance"]
    per: ["PER", "Plan d'Épargne Retraite", "PERCOL"]
    livret: ["Livret A", "LDD", "Livret bleu", "LEP"]

  colonnes_attendues:
    - nom: "isin"
      patterns: ["Code ISIN", "ISIN"]
    - nom: "libelle"
      patterns: ["Libellé", "Valeur", "Support"]
    - nom: "quantite"
      patterns: ["Nombre de parts", "Quantité", "Nombre"]
    - nom: "valorisation"
      patterns: ["Valeur de rachat", "Valorisation", "Montant"]
    - nom: "cours"
      patterns: ["Valeur de part", "Cours", "VL"]

  filtres_lignes:
    exclure_si_contient: ["Total", "TOTAL", "Autres avoirs"]
    inclure_si_isin: false

regex_isin: '\b([A-Z]{2}[A-Z0-9]{9}[0-9])\b'
regex_montant_eur: '(\d{1,3}(?:[\s.,]\d{3})*(?:[,.]\d{2})?)\s*€?'

post_traitement:
  normalise_devises: true
  conversion_si_non_eur: false
